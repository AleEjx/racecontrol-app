<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Party Mode Overlay</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-app-region: no-drag;
  }
  /* Continuous smooth rainbow wash — standard alpha compositing tints
     whatever's on the real desktop underneath this transparent window.
     Smooth hue sweep only, never discrete flashing (seizure-safety —
     see party-mode.css in the main app for the full note). */
  @keyframes rc-wash-hue {
    from { filter: hue-rotate(0deg); }
    to   { filter: hue-rotate(360deg); }
  }
  #rc-wash {
    position: fixed; inset: -10%;
    width: 120%; height: 120%;
    background: linear-gradient(120deg, #ff2d55, #ff8a1e, #ffcc00, #10e58a, #3d8bff, #7c4dff, #ff2d55);
    background-size: 300% 300%;
    opacity: 0.22;
    animation: rc-wash-hue 1.2s linear infinite, rc-wash-drift 6s ease-in-out infinite;
  }
  @keyframes rc-wash-drift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes rc-shake-v { 0%{transform:translateY(0);} 25%{transform:translateY(-22px);} 55%{transform:translateY(6px);} 80%{transform:translateY(-5px);} 100%{transform:translateY(0);} }
  @keyframes rc-shake-h { 0%{transform:translateX(0);} 25%{transform:translateX(-20px);} 55%{transform:translateX(8px);} 80%{transform:translateX(-4px);} 100%{transform:translateX(0);} }
  @keyframes rc-distort { 0%{transform:skew(0,0) scale(1);} 30%{transform:skew(3deg,1deg) scale(1.02);} 60%{transform:skew(-2.5deg,-0.6deg) scale(0.985);} 100%{transform:skew(0,0) scale(1);} }
  @keyframes rc-glitch {
    0%{transform:translate(0,0);filter:none;}
    15%{transform:translate(-10px,3px);filter:hue-rotate(40deg) contrast(1.4);}
    30%{transform:translate(9px,-4px);filter:hue-rotate(-40deg) contrast(1.4);}
    45%{transform:translate(-5px,2px);filter:none;}
    60%{transform:translate(6px,3px);filter:hue-rotate(25deg);}
    100%{transform:translate(0,0);filter:none;}
  }

  @keyframes rc-keyflash-pop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6) rotate(-6deg); }
    15%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08) rotate(2deg); }
    30%  { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  .rc-keyflash {
    position: fixed; top: 50%; left: 50%;
    font-family: 'Courier New', monospace;
    font-weight: 800; font-size: 140px;
    color: #f0f0f6;
    background: #131319;
    border: 3px solid #10e58a;
    border-radius: 20px;
    padding: 12px 38px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    animation: rc-keyflash-pop 0.7s ease-out forwards;
  }

  @keyframes rc-fade-scale {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.92); }
    15%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    85%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(0.96); }
  }
  .rc-alttab {
    position: fixed; top: 50%; left: 50%;
    display: flex; gap: 16px; padding: 24px;
    background: rgba(19,19,25,0.92);
    border: 1px solid #23232f;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    animation: rc-fade-scale 1.1s ease-out forwards;
  }
  .rc-alttab-tile {
    width: 72px; height: 72px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    background: #191922;
    border: 1px solid #23232f;
  }
  .rc-alttab-tile.rc-active { border-color: #10e58a; box-shadow: 0 0 0 2px rgba(16,229,138,0.25); }

  @keyframes rc-popup-in { 0%{opacity:0;transform:scale(0.85) rotate(-2deg);} 100%{opacity:1;transform:scale(1) rotate(0deg);} }
  .rc-popup {
    position: fixed;
    width: 230px;
    padding: 18px 14px 14px;
    border-radius: 14px;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    line-height: 1.4;
    font-family: system-ui, sans-serif;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    animation: rc-popup-in 0.35s cubic-bezier(0.34,1.56,0.64,1);
    background: linear-gradient(135deg, #ff2d55, #ff8a1e);
    pointer-events: auto;
  }
  .rc-popup.rc-alt2 { background: linear-gradient(135deg, #3d8bff, #10e58a); }
  .rc-popup.rc-alt3 { background: linear-gradient(135deg, #ffcc00, #ff2d55); color: #1a1a1a; }
  .rc-popup-close {
    position: absolute; top: 6px; right: 6px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    color: #fff; border: none;
    font-size: 14px; line-height: 24px;
    cursor: pointer;
    transition: left 0.12s ease, top 0.12s ease;
  }

  .rc-badge {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    font-family: system-ui, sans-serif;
    font-size: 11px; font-weight: 800; letter-spacing: 0.04em;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(0,0,0,0.55);
    color: #fff; border: 1px solid rgba(255,255,255,0.25);
  }
</style>
</head>
<body>
  <div id="rc-wash"></div>
  <script src="party-mode-overlay.js"></script>
</body>
</html>
