<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Party Mode Overlay</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-app-region: no-drag;
  }
  /* Continuous smooth rainbow wash — standard alpha compositing tints
     whatever's on the real desktop underneath this transparent window.
     Smooth hue sweep only, never discrete flashing (seizure-safety —
     see party-mode.css in the main app for the full note). */
  @keyframes rc-wash-hue {
    from { filter: hue-rotate(0deg); }
    to   { filter: hue-rotate(360deg); }
  }
  #rc-wash {
    position: fixed; inset: -10%;
    width: 120%; height: 120%;
    background: linear-gradient(120deg, #ff2d55, #ff8a1e, #ffcc00, #10e58a, #3d8bff, #7c4dff, #ff2d55);
    background-size: 300% 300%;
    opacity: 0.22;
    animation: rc-wash-hue 1.2s linear infinite, rc-wash-drift 6s ease-in-out infinite;
  }
  @keyframes rc-wash-drift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes rc-shake-v { 0%{transform:translateY(0);} 25%{transform:translateY(-22px);} 55%{transform:translateY(6px);} 80%{transform:translateY(-5px);} 100%{transform:translateY(0);} }
  @keyframes rc-shake-h { 0%{transform:translateX(0);} 25%{transform:translateX(-20px);} 55%{transform:translateX(8px);} 80%{transform:translateX(-4px);} 100%{transform:translateX(0);} }
  @keyframes rc-distort { 0%{transform:skew(0,0) scale(1);} 30%{transform:skew(3deg,1deg) scale(1.02);} 60%{transform:skew(-2.5deg,-0.6deg) scale(0.985);} 100%{transform:skew(0,0) scale(1);} }
  @keyframes rc-glitch {
    0%{transform:translate(0,0);filter:none;}
    15%{transform:translate(-10px,3px);filter:hue-rotate(40deg) contrast(1.4);}
    30%{transform:translate(9px,-4px);filter:hue-rotate(-40deg) contrast(1.4);}
    45%{transform:translate(-5px,2px);filter:none;}
    60%{transform:translate(6px,3px);filter:hue-rotate(25deg);}
    100%{transform:translate(0,0);filter:none;}
  }

  @keyframes rc-keyflash-pop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6) rotate(-6deg); }
    15%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08) rotate(2deg); }
    30%  { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  .rc-keyflash {
    position: fixed; top: 50%; left: 50%;
    font-family: 'Courier New', monospace;
    font-weight: 800; font-size: 140px;
    color: #f0f0f6;
    background: #131319;
    border: 3px solid #10e58a;
    border-radius: 20px;
    padding: 12px 38px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    animation: rc-keyflash-pop 0.7s ease-out forwards;
  }

  @keyframes rc-fade-scale {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.92); }
    15%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    85%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(0.96); }
  }
  .rc-alttab {
    position: fixed; top: 50%; left: 50%;
    display: flex; gap: 16px; padding: 24px;
    background: rgba(19,19,25,0.92);
    border: 1px solid #23232f;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    animation: rc-fade-scale 1.1s ease-out forwards;
  }
  .rc-alttab-tile {
    width: 72px; height: 72px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    background: #191922;
    border: 1px solid #23232f;
  }
  .rc-alttab-tile.rc-active { border-color: #10e58a; box-shadow: 0 0 0 2px rgba(16,229,138,0.25); }

  @keyframes rc-popup-in { 0%{opacity:0;transform:scale(0.85) rotate(-2deg);} 100%{opacity:1;transform:scale(1) rotate(0deg);} }
  .rc-popup {
    position: fixed;
    width: 440px;
    padding: 28px 22px 20px;
    border-radius: 20px;
    color: #fff;
    font-weight: 700;
    font-size: 21px;
    text-align: center;
    line-height: 1.4;
    font-family: system-ui, sans-serif;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    animation: rc-popup-in 0.35s cubic-bezier(0.34,1.56,0.64,1);
    background: linear-gradient(135deg, #ff2d55, #ff8a1e);
    pointer-events: auto;
  }
  .rc-popup.rc-alt2 { background: linear-gradient(135deg, #3d8bff, #10e58a); }
  .rc-popup.rc-alt3 { background: linear-gradient(135deg, #ffcc00, #ff2d55); color: #1a1a1a; }
  .rc-popup-close {
    position: absolute; top: 6px; right: 6px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    color: #fff; border: none;
    font-size: 11px; line-height: 20px;
    cursor: pointer;
    transition: left 0.12s ease, top 0.12s ease;
  }

  @keyframes rc-glitch-big {
    0%{transform:translate(0,0) scale(1);filter:none;}
    10%{transform:translate(-22px,7px) scale(1.015);filter:hue-rotate(60deg) contrast(1.6) saturate(1.4);}
    22%{transform:translate(18px,-11px) scale(0.988);filter:hue-rotate(-60deg) contrast(1.6);}
    35%{transform:translate(-12px,5px) scale(1.018);filter:none;}
    48%{transform:translate(14px,7px) scale(1);filter:hue-rotate(30deg);}
    62%{transform:translate(-7px,-5px) scale(1);filter:none;}
    100%{transform:translate(0,0) scale(1);filter:none;}
  }
  @keyframes rc-wash-surge { 0%{opacity:0.22;} 30%{opacity:0.5;} 100%{opacity:0.22;} }
  @keyframes rc-wash-surge-flat { 0%{opacity:0;} 30%{opacity:0.32;} 100%{opacity:0;} }

  @keyframes rc-edge-intrude {
    0%   { transform: translate(var(--rc-ex,0), var(--rc-ey,0)); opacity: 0; }
    20%  { opacity: 1; }
    40%  { transform: translate(0,0); opacity: 1; }
    72%  { transform: translate(0,0); opacity: 1; }
    100% { transform: translate(var(--rc-ex,0), var(--rc-ey,0)); opacity: 0; }
  }
  .rc-edge {
    position: fixed;
    font-family: system-ui, sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c4dff, #3d8bff);
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    animation: rc-edge-intrude 1.8s ease-in-out forwards;
  }

  .rc-cursor {
    position: fixed;
    font-size: 30px;
    transform: translate(-4px, -2px);
    transition: left 0.35s ease, top 0.35s ease;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  }

  .rc-popup img {
    display: block;
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 6px;
  }

  @keyframes rc-blackout {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { opacity: 0; }
  }
  .rc-blackout {
    position: fixed;
    inset: 0;
    z-index: 1000003;
    pointer-events: none;
    background: #000;
    opacity: 0;
    animation: rc-blackout var(--rc-bo-dur, 5s) ease-in-out forwards;
  }

  .rc-countdown {
    position: fixed;
    z-index: 999997;
    pointer-events: none;
    font-family: 'Courier New', monospace;
    font-weight: 800;
    font-size: 40px;
    color: #fff;
    background: rgba(19,19,25,0.85);
    border: 2px solid #10e58a;
    border-radius: 14px;
    padding: 10px 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  }

  @keyframes rc-bomb-pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 24px 4px rgba(255,45,85,0.35); }
    50%      { transform: scale(1.035); box-shadow: 0 0 40px 10px rgba(255,45,85,0.55); }
  }
  .rc-bomb {
    position: fixed;
    z-index: 1000002;
    pointer-events: none;
    width: 220px;
    padding: 22px 18px;
    border-radius: 16px;
    background: #0c0c10;
    border: 3px solid #ff2d55;
    text-align: center;
    font-family: 'Courier New', monospace;
    color: #fff;
    box-shadow: 0 0 24px 4px rgba(255,45,85,0.35);
    animation: rc-bomb-pulse 0.9s ease-in-out infinite;
  }
  .rc-bomb-icon { font-size: 34px; margin-bottom: 4px; }
  .rc-bomb-num { font-size: 56px; font-weight: 800; color: #ff2d55; line-height: 1; }
  .rc-bomb-label { font-size: 11px; letter-spacing: 0.08em; opacity: 0.7; margin-top: 4px; }

  .rc-badge {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    font-family: system-ui, sans-serif;
    font-size: 11px; font-weight: 800; letter-spacing: 0.04em;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(0,0,0,0.55);
    color: #fff; border: 1px solid rgba(255,255,255,0.25);
  }

  /* Rave build-up countdown — a black box, top-left, that gets more
     ominous as it approaches zero. Glow pulse stays slow/smooth
     (ambient tension), only speeding up in the final seconds — never
     past ~1Hz, so it stays well clear of flash-safety thresholds
     (same rule as the rest of this file: no discrete strobing). */
  @keyframes rc-rave-glow {
    0%, 100% { box-shadow: 0 0 18px 4px rgba(255,45,85,0.35), inset 0 0 16px rgba(255,45,85,0.12); }
    50%      { box-shadow: 0 0 30px 8px rgba(255,45,85,0.55), inset 0 0 24px rgba(255,45,85,0.22); }
  }
  .rc-rave-timer {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 1000000;
    font-family: 'Courier New', monospace;
    text-align: center;
    min-width: 110px;
    padding: 12px 20px;
    border-radius: 10px;
    background: #000;
    border: 2px solid #ff2d55;
    animation: rc-rave-glow 2.4s ease-in-out infinite;
  }
  .rc-rave-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: #ff2d55;
    opacity: 0.85;
  }
  .rc-rave-num {
    font-size: 34px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.03em;
    text-shadow: 0 0 10px rgba(255,45,85,0.85);
  }
  /* Final 10 seconds — glow speeds up and the box gets a slight
     nervous shake (reuses the existing rc-shake-h keyframe). */
  .rc-rave-timer.rc-rave-critical {
    animation: rc-rave-glow 0.9s ease-in-out infinite, rc-shake-h 0.4s ease-in-out infinite;
  }
  .rc-rave-timer.rc-rave-critical .rc-rave-num { color: #ff2d55; }
  /* Rave live — box stays up as a "we're in it now" marker. */
  .rc-rave-timer.rc-rave-live {
    animation: rc-rave-glow 0.9s ease-in-out infinite;
  }
</style>
</head>
<body>
  <div id="rc-wash"></div>
  <script src="party-mode-overlay.js"></script>
</body>
</html>
