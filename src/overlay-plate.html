<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { background: transparent; margin: 0; overflow: hidden; }
    .ov-body {
      -webkit-app-region: drag;
      cursor: grab;
      padding: 6px;
    }
    .ov-body:active { cursor: grabbing; }
    .rc-action-block, button, input, select {
      -webkit-app-region: no-drag;
    }

    button:focus,
button:focus-visible,
.rc-action-block:focus,
.rc-action-block:focus-visible {
  outline: none;
  box-shadow: none;
}

    .ov-resize-grip {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      -webkit-app-region: no-drag;
      background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.25) 50%);
    }
    .ov-resize-grip-h {
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: ew-resize;
      -webkit-app-region: no-drag;
    }

    .ov-scale-wrap {
      transform-origin: top left;
    }

    .ov-zoom-ctrl {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 3px;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 5;
    }
    .ov-body:hover .ov-zoom-ctrl { opacity: 1; }
    .ov-zoom-ctrl button {
      width: 16px;
      height: 16px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
      background: rgba(0,0,0,0.55);
      color: #e8e8f0;
      font-size: 10px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .ov-zoom-ctrl button:hover {
      background: rgba(41,121,255,0.6);
      border-color: rgba(41,121,255,0.8);
    }
    
  </style>
</head>
<body>
  <div class="ov-body">
    <div class="ov-zoom-ctrl" id="ov-zoom-ctrl">
      <button onclick="adjustOverlayScale(-0.1)" title="Smaller">－</button>
      <button onclick="adjustOverlayScale(0.1)" title="Bigger">＋</button>
    </div>
    <div class="ov-scale-wrap" id="ov-scale-wrap">
    <div class="rc-plate on" id="rc-plate" style="margin:0;">
      <div class="rc-plate-pit-flag">IN PITS</div>
      <div class="rc-plate-top">
        <div class="rc-plate-num"><div class="n" id="rc-plate-num">--</div><div class="l">CAR</div></div>
        <div class="rc-plate-id">
          <div class="rc-plate-name" id="rc-plate-name">–</div>
          <div class="rc-plate-call" id="rc-plate-call">–</div>
        </div>
      </div>
      <div class="rc-plate-stats">
        <div class="rc-plate-stat"><div class="rc-plate-stat-label">Pos</div><div class="rc-plate-stat-val pos" id="rc-plate-pos">–</div></div>
        <div class="rc-plate-stat"><div class="rc-plate-stat-label">Gap</div><div class="rc-plate-stat-val" id="rc-plate-gap">–</div></div>
        <div class="rc-plate-stat"><div class="rc-plate-stat-label">Lap</div><div class="rc-plate-stat-val" id="rc-plate-lap">–</div></div>
        <div class="rc-plate-stat"><div class="rc-plate-stat-label">Best</div><div class="rc-plate-stat-val" id="rc-plate-best">–</div></div>
      </div>
    </div>

    <div id="ov-actions" class="rc-block-grid mt-6" style="display:none;">
      <button class="rc-action-block primary" onclick="window.api.sendAction('next_lap')">
        <span class="ai">🏁</span><span class="al">Next Lap</span>
      </button>
      <button class="rc-action-block" onclick="window.api.sendAction('blue_flag')">
        <span class="ai">🔵</span><span class="al">Blue Flag</span>
      </button>
      <button class="rc-action-block" onclick="window.api.togglePitting()">
        <span class="ai" id="ov-pit-icon">🔧</span><span class="al" id="ov-pit-label">Pitting</span>
      </button>
    </div>
    </div>
  </div>

  <script>
    let config = null, apiUrl = "";
    let _ovScale = 1;
    let _ovScaleSaveTimer = null;

    function formatLapTime(seconds) {
      if (typeof seconds !== "number" || isNaN(seconds)) return "–";
      const mins = Math.floor(seconds / 60);
      const secs = (seconds % 60).toFixed(2);
      return mins > 0 ? `${mins}:${secs.padStart(5, "0")}` : `${secs}s`;
    }

    function applyOverlayScale(scale) {
      _ovScale = Math.round(Math.min(2, Math.max(0.7, scale)) * 100) / 100;
      const wrap = document.getElementById("ov-scale-wrap");
      if (wrap) wrap.style.zoom = _ovScale;
      requestAnimationFrame(() => requestAnimationFrame(fitWindowHeight));
    }

    function adjustOverlayScale(delta) {
      applyOverlayScale(_ovScale + delta);
      if (config) {
        config.overlayScale = _ovScale;
        clearTimeout(_ovScaleSaveTimer);
        _ovScaleSaveTimer = setTimeout(() => window.api.saveConfig(config), 400);
      }
    }

    document.addEventListener("wheel", (e) => {
      e.preventDefault();
      adjustOverlayScale(e.deltaY < 0 ? 0.05 : -0.05);
    }, { passive: false });

    async function poll() {
      if (!apiUrl || !config?.driver) return;
      try {
        const res = await fetch(`${apiUrl}/driver/state`);
        if (!res.ok) return;
        const data = await res.json();
        const d = data.drivers?.find(x => x.name === config.driver);
        document.getElementById("rc-plate-num").textContent = config.number || "??";
        document.getElementById("rc-plate-name").textContent = config.driver;
        document.getElementById("rc-plate-call").textContent = config.callsign || "";
        if (d) {
          document.getElementById("rc-plate-pos").textContent = d.position ? `P${d.position}` : "–";
          document.getElementById("rc-plate-gap").textContent = d.finished ? "FIN" : d.dnf ? "DNF" : (d.gap || "–");
          document.getElementById("rc-plate-lap").textContent = d.lap || 1;
          document.getElementById("rc-plate").classList.toggle("pitting", !!d.inPits);
          document.getElementById("ov-pit-label").textContent = d.inPits ? "In Pits" : "Pitting";
          const laps = (d.lapDurations || []).filter(l => !l.pit && !l.unstable);
          document.getElementById("rc-plate-best").textContent = laps.length ? formatLapTime(Math.min(...laps.map(l => l.time))) : "–";
        }
      } catch {}
    }

    function fitWindowHeight() {
      const body = document.querySelector(".ov-body");
      if (!body) return;
      const h = Math.ceil(body.getBoundingClientRect().height) + 4;
      window.api.overlayFitHeight(h);
    }

window.addEventListener("DOMContentLoaded", async () => {
  config = await window.api.getConfig();
  apiUrl = config.apiUrl || "";
  const prefs = config.overlayPrefs || {};

  applyOverlayScale(config.overlayScale || 1);

  if (config.engineer && prefs.showActions !== false) {
    document.getElementById("ov-actions").style.display = "grid";
  }
  if (prefs.showStats === false) {
    document.querySelector(".rc-plate-stats").style.display = "none";
  }
  if (prefs.showPitBanner === false) {
    document.querySelector(".rc-plate-pit-flag").style.display = "none";
  }

  requestAnimationFrame(() => requestAnimationFrame(fitWindowHeight));
  poll();
  setInterval(poll, 3000);
});
  </script>
  <div class="ov-resize-grip" id="ov-resize-grip"></div>
  <div class="ov-resize-grip-h" id="ov-resize-grip-h"></div>
</body>
</html>
