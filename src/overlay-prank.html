/* ── Desktop gorilla ── */

  width: 100%; height: 100%;

  filter: drop-shadow(0 0 14px rgba(255,0,0,0.8));

  position: fixed;
  top: 50%; left: 50%;

/* scanlines */
#red-bg::after {
  content:''; position:absolute; inset:0;
  background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.10) 2px,rgba(0,0,0,0.10) 4px);
  pointer-events:none;
}

/* ── Red-screen gorilla (grows + shakes) ── */
#gorilla-red {
  position: absolute;
  top:50%; left:50%;
  transform: translate(-50%,-50%) scale(0.08);
  z-index: 110;
  pointer-events: none;
  width: 640px; height: 640px;
}
#gorilla-red img {
  width:100%; height:100%; object-fit:contain;
  filter: drop-shadow(0 0 30px #f00) drop-shadow(0 0 80px #f00) brightness(1.6) contrast(1.4);
}
@keyframes shake {
  0%   { transform:translate(calc(-50% +  0px),calc(-50% +  0px)) rotate( 0.0deg); }
  10%  { transform:translate(calc(-50% - 13px),calc(-50% +  7px)) rotate(-2.0deg); }
  20%  { transform:translate(calc(-50% + 16px),calc(-50% -  9px)) rotate( 2.5deg); }
  30%  { transform:translate(calc(-50% -  9px),calc(-50% + 13px)) rotate(-1.0deg); }
  40%  { transform:translate(calc(-50% + 19px),calc(-50% +  4px)) rotate( 2.0deg); }
  50%  { transform:translate(calc(-50% - 15px),calc(-50% -  8px)) rotate(-2.5deg); }
  60%  { transform:translate(calc(-50% + 11px),calc(-50% + 15px)) rotate( 1.5deg); }
  70%  { transform:translate(calc(-50% - 19px),calc(-50% - 13px)) rotate(-1.5deg); }
  80%  { transform:translate(calc(-50% +  8px),calc(-50% + 10px)) rotate( 3.0deg); }
  90%  { transform:translate(calc(-50% - 11px),calc(-50% - 16px)) rotate(-2.0deg); }
  100% { transform:translate(calc(-50% +  0px),calc(-50% +  0px)) rotate( 0.0deg); }
}

/* ── Stop sign field ── */
#stop-field { position:absolute; inset:0; pointer-events:none; }
.ms {
  position:absolute;
  display:flex; align-items:center; justify-content:center;
  background: #cc0000;
  clip-path: polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);
  transform: scale(0);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  filter: drop-shadow(0 0 6px rgba(255,0,0,0.9));
}

/* ── Download bar ── */
#dl-wrap {
  position: absolute; top:50%; left:50%;
  transform: translate(-50%,-50%);
  z-index: 200;
  display: none;
  flex-direction: column; align-items: center; gap:8px;
  background: rgba(0,0,0,0.75);
  border: 2px solid #00ff00;
  border-radius: 3px;
  padding: 14px 24px;
  min-width: 320px;
}
#dl-label {
  font-family:'Courier New',monospace;
  font-size:15px; font-weight:bold;
  color:#00ff00; letter-spacing:2px;
}
#dl-track {
  width:100%; height:20px;
  background:#111; border:1px solid #009900; border-radius:2px; overflow:hidden;
}
#dl-fill {
  height:100%; width:0%;
  background: linear-gradient(90deg,#009900,#00ff00);
}
#dl-pct {
  font-family:'Courier New',monospace;
  font-size:11px; color:#00ff00;
}

/* ── Glitch bars ── */
.gb {
  position:absolute; left:0; right:0; pointer-events:none; z-index:115;
  animation: gbSweep linear infinite;
}
@keyframes gbSweep { from{top:-8px;opacity:1} to{top:100%;opacity:0} }

/* ── Final ransom screen ── */
#ransom {
  position: fixed; inset:0;
  display: none;

#ransom-box {
  width: 580px;
  border: 3px solid #666;
  box-shadow: 5px 5px 0 rgba(0,0,0,0.8), 0 0 50px rgba(0,0,0,0.6);
  font-family: 'Courier New', monospace;
}
#r-title {
  background: #3a6e1f;
  color: #fff; font-family:'Courier New',monospace;
  font-size:13px; font-weight:bold; letter-spacing:1px;
  padding: 5px 10px;
  border-bottom: 2px solid #234412;
}
#r-main {
  display:flex; gap:0;
  padding: 16px; background:#cc0000;
  align-items: center;
}
#r-skull {
  width:170px; height:170px; flex-shrink:0;
  object-fit:contain;
  filter: brightness(0.85) contrast(1.3);
}
#r-text {
  flex:1;
  font-family:'Courier New',monospace;
  font-size:27px; font-weight:900;
  color:#fff; text-align:center;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
  line-height:1.2; padding: 0 12px;
}
#r-warn {
  background:#000; color:#fff;
  font-family:'Courier New',monospace;
  font-size:12px; font-weight:bold;
  padding: 10px 16px; line-height:1.55;
  text-align:center; letter-spacing:0.3px;
  border-top:2px solid #333; border-bottom:2px solid #333;
}
#r-footer {
  display:flex; align-items:center; justify-content:space-between;
  background:#cc0000; padding: 12px 16px;
}
#r-amount {
  font-family:'Courier New',monospace;
  font-size:34px; font-weight:900;
  color:#ffdd00; text-shadow:1px 1px 0 #9a7f00;
  display:flex; align-items:center; gap:8px;
}
#r-timer {
  font-family:'Courier New',monospace;
  font-size:26px; font-weight:900; color:#fff;
  background:#000; border:2px solid #444;
  padding: 7px 16px; letter-spacing:2px; min-width:168px; text-align:center;
}

/* ── Thank you screen ── */
#thankyou {
  position: fixed; inset:0;
  display: none;
  align-items: center; justify-content: center;
  z-index: 1000;
  background: #22cc00;
}
#ty-box {
  width: 520px;
  font-family: 'Courier New', monospace;
  border: 3px solid #555;
  box-shadow: 5px 5px 0 rgba(0,0,0,0.5);
}
#ty-title {
  background: #d4d0c8;
  color: #000;
  font-size: 12px; font-weight: bold;
  padding: 4px 8px;
  border-bottom: 2px solid #999;
  letter-spacing: 0.5px;
}
#ty-body {
  background: #22cc00;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 20px 32px;
  gap: 20px;
}
#ty-text {
  font-family: 'Arial Black', 'Impact', sans-serif;
  font-size: 58px;
  font-weight: 900;
  font-style: italic;
  color: #fff;
  text-shadow: 3px 3px 0 rgba(0,0,0,0.25);
  letter-spacing: 2px;
  white-space: nowrap;
}
/* Pixel-art thumbs-up stop sign */
#ty-sign-wrap {
  width: 180px; height: 180px;
  background: #33dd00;
  clip-path: polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);
  display: flex; align-items: center; justify-content: center;
  image-rendering: pixelated;
  border: 4px solid #1aaa00;
  animation: tyPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  transform: scale(0);
}
@keyframes tyPop {
  from { transform: scale(0) rotate(-15deg); }
  to   { transform: scale(1) rotate(0deg); }
}
#ty-thumb {
  font-size: 88px;
  image-rendering: pixelated;
  filter: brightness(0.65) sepia(0.5) hue-rotate(60deg) saturate(3);
}

/* ── ESC hint ── */
#hint {
  position:fixed; bottom:12px; right:14px;
  font-family:'Courier New',monospace; font-size:9px;
  color:rgba(255,255,255,0.12); z-index:9999;
}
</style>

// ── Elements ──
const gorillaWrap = document.getElementById('gorilla-wrap');
const stopWrap    = document.getElementById('stop-wrap');
const redLayer    = document.getElementById('red-layer');
const gorillaRed  = document.getElementById('gorilla-red');
const stopField   = document.getElementById('stop-field');
const dlWrap      = document.getElementById('dl-wrap');
const dlFill      = document.getElementById('dl-fill');
const dlPct       = document.getElementById('dl-pct');
const ransom      = document.getElementById('ransom');

// ── Gorilla physics ──
let gy = -130, gvy = 0, gAnimId = null;

function resetGorilla(xPct) {
  if (gAnimId) { cancelAnimationFrame(gAnimId); gAnimId = null; }
  gy = -130; gvy = 0;
  gorillaWrap.style.left = (window.innerWidth * (xPct || 0.62)) + 'px';
  gorillaWrap.style.top  = '-130px';
  gorillaWrap.style.opacity = '0';
}

function dropGorilla(xPct, onLand) {
  resetGorilla(xPct);
  gorillaWrap.style.opacity = '1';
  const targetY = window.innerHeight * 0.22;
  function frame() {
    gvy += 5; gy += gvy;
    if (gy >= targetY) {
      gvy = -gvy * 0.48;
      gy = targetY;
      if (Math.abs(gvy) < 2.5) {
        gy = targetY;
        gorillaWrap.style.top = gy + 'px';
        if (onLand) onLand();
        return;
      }
    }
    gorillaWrap.style.top = gy + 'px';
    gAnimId = requestAnimationFrame(frame);
  }
  gAnimId = requestAnimationFrame(frame);
}

function fadeOutGorilla(cb) {
  gorillaWrap.style.transition = 'opacity 0.35s';
  gorillaWrap.style.opacity = '0';
  setTimeout(() => { gorillaWrap.style.transition = ''; cb && cb(); }, 350);
}

// ── Stop sign ──
function showStop(cb) {
  stopWrap.classList.add('show');
  setTimeout(() => cb && cb(), 400);
}
function hideStop(cb) {
  stopWrap.style.opacity = '0';
  setTimeout(() => {
    stopWrap.classList.remove('show');
    stopWrap.style.opacity = '';
    cb && cb();
  }, 260);
}

// ── Flash ──
function flash(cb) {
  document.body.style.background = 'rgba(255,0,0,0.6)';
  setTimeout(() => { document.body.style.background = 'transparent'; cb && cb(); }, 120);
}

// ─────────────────────────────────────────────
// ACT 1 — Desktop: gorilla drops, stop sign, clear
// ─────────────────────────────────────────────
function act1() {
  setTimeout(() => {
    dropGorilla(0.62, () => {
      // landed — show stop sign after 0.9s
      setTimeout(() => {
        showStop(() => {
          // stop sign visible 1.6s then clear
          setTimeout(() => {
            hideStop();
            fadeOutGorilla(() => {
              // brief clear (0.7s) then act 2
              setTimeout(act2, 700);
            });
          }, 1600);
        });
      }, 900);
    });
  }, 500);
}

// ─────────────────────────────────────────────
// ACT 2 — Gorilla + stop sign again → RED SCREEN
// ─────────────────────────────────────────────
function act2() {
  dropGorilla(0.58, () => {
    setTimeout(() => {
      showStop(() => {
        setTimeout(() => {
          hideStop();
          fadeOutGorilla(() => {
            setTimeout(act3red, 180);
          });
        }, 1200);
      });
    }, 750);
  });
}

// ─────────────────────────────────────────────
// ACT 3 — Red screen, gorilla grows + shakes
// ─────────────────────────────────────────────
function act3red() {
  redLayer.style.display = 'block';
  flash();

  // Start gorilla tiny, grow to full size
  gorillaRed.style.transform = 'translate(-50%,-50%) scale(0.07)';
  gorillaRed.style.transition = 'transform 2s cubic-bezier(0.25,0.1,0.25,1)';

  setTimeout(() => {
    gorillaRed.style.transform = 'translate(-50%,-50%) scale(1.08)';
    // After growth finishes, shake
    setTimeout(() => {
      gorillaRed.style.transition = '';
      gorillaRed.style.animation = 'shake 0.055s linear infinite';
      // Shake for 2.2s then act 4
      setTimeout(act4stops, 2200);
    }, 2050);
  }, 80);
}

// ─────────────────────────────────────────────
// ACT 4 — Stop signs flood + download bar
// ─────────────────────────────────────────────
function act4stops() {
  // Gorilla exits (shrinks away)
  gorillaRed.style.animation = '';
  gorillaRed.style.transition = 'transform 0.45s ease-in, opacity 0.45s';
  gorillaRed.style.transform = 'translate(-50%,-50%) scale(0)';
  gorillaRed.style.opacity = '0';

  // Spawn 24 stop signs over ~2.5s
  const N = 24;
  for (let i = 0; i < N; i++) {
    setTimeout(() => spawnStop(), i * 105);
  }

  // Download bar appears after all signs
  setTimeout(() => {
    dlWrap.style.display = 'flex';
    fillDownload(0, () => {
      // flash then ransom
      setTimeout(() => {
        flash();
        setTimeout(act5ransom, 400);
      }, 300);
    });
  }, N * 105 + 350);
}

function spawnStop() {
  const el = document.createElement('div');
  el.className = 'ms';
  el.textContent = '✋';
  const size = 72 + Math.random() * 64;
  el.style.width  = size + 'px';
  el.style.height = size + 'px';
  el.style.fontSize = (size * 0.43) + 'px';

  // Random position, avoid center download bar area
  let x, y;
  const cxMin = window.innerWidth/2  - 220;
  const cxMax = window.innerWidth/2  + 220;
  const cyMin = window.innerHeight/2 - 80;
  const cyMax = window.innerHeight/2 + 80;
  let attempts = 0;
  do {
    x = Math.random() * (window.innerWidth  - size);
    y = Math.random() * (window.innerHeight - size);
    attempts++;
  } while (attempts < 20 && x > cxMin && x < cxMax && y > cyMin && y < cyMax);

  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  el.style.transform = 'scale(0) rotate(' + ((Math.random()-0.5)*40) + 'deg)';
  stopField.appendChild(el);

  requestAnimationFrame(() => {
    el.style.transform = 'scale(1) rotate(' + ((Math.random()-0.5)*20) + 'deg)';
  });
}

function fillDownload(pct, done) {
  dlFill.style.width = pct + '%';
  dlPct.textContent  = Math.round(pct) + '%';
  if (pct >= 100) { done(); return; }
  const inc = 0.6 + Math.random() * 1.8;
  setTimeout(() => fillDownload(Math.min(100, pct + inc), done), 38);
}

// ─────────────────────────────────────────────
// ACT 5 — Ransom screen
// ─────────────────────────────────────────────
let timerM = 1, timerS = 17, timerOn = false;

function act5ransom() {
  redLayer.style.display = 'none';
  ransom.style.display = 'flex';
  timerOn = true;
  tickTimer();
}

function tickTimer() {
  if (!timerOn) return;
  document.getElementById('r-timer').textContent =
    'TIME: ' + String(timerM).padStart(2,'0') + ':' + String(timerS).padStart(2,'0');
  timerS--;
  if (timerS < 0) { timerS = 59; timerM--; }
  if (timerM < 0) { timerM = 0; timerS = 0; timerOn = false; showThankYou(); return; }
  setTimeout(tickTimer, 1000);
}

// ── Thank you reveal ──
function showThankYou() {
  ransom.style.display = 'none';
  const ty = document.getElementById('thankyou');
  ty.style.display = 'flex';
  // Animate the sign in with a slight delay for drama
  setTimeout(() => {
    document.getElementById('ty-sign-wrap').style.animationPlayState = 'running';
  }, 200);
  // Close automatically after 6s
  setTimeout(closePrank, 6000);
}

// ── Close ──
function closePrank() {
  timerOn = false;
  try { window.api.hidePrank(); } catch { window.close(); }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePrank(); });
document.addEventListener('click', () => {
  const ty = document.getElementById('thankyou');
  if (ransom.style.display === 'flex' || ty.style.display === 'flex') closePrank();
});

// ── GO ──
act1();
</script>
