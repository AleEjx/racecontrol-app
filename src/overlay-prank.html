#skull-red {
  position:absolute; top:50%; left:50%;
  width:600px; height:600px;
  z-index:110; pointer-events:none; display:none;
}
#skull-red img { width:100%; height:100%; object-fit:contain; }
@keyframes shake {
  0%   { transform:translate(calc(-50% + 0px),  calc(-50% + 0px))  rotate(0deg); }
  10%  { transform:translate(calc(-50% - 14px), calc(-50% + 8px))  rotate(-2.5deg); }
  20%  { transform:translate(calc(-50% + 17px), calc(-50% - 10px)) rotate(3deg); }
  30%  { transform:translate(calc(-50% - 10px), calc(-50% + 14px)) rotate(-1.5deg); }
  40%  { transform:translate(calc(-50% + 20px), calc(-50% + 5px))  rotate(2.5deg); }
  50%  { transform:translate(calc(-50% - 16px), calc(-50% - 9px))  rotate(-3deg); }
  60%  { transform:translate(calc(-50% + 12px), calc(-50% + 16px)) rotate(2deg); }
  70%  { transform:translate(calc(-50% - 20px), calc(-50% - 14px)) rotate(-2deg); }
  80%  { transform:translate(calc(-50% + 9px),  calc(-50% + 11px)) rotate(3.5deg); }
  90%  { transform:translate(calc(-50% - 12px), calc(-50% - 17px)) rotate(-2.5deg); }
  100% { transform:translate(calc(-50% + 0px),  calc(-50% + 0px))  rotate(0deg); }
}
#skull-red.shaking { animation:shake 0.055s linear infinite; }

#stop-field { position:absolute; inset:0; pointer-events:none; z-index:120; }
.ms { position:absolute; display:none; }
.ms img { width:100%; height:100%; object-fit:contain; }

#dl-wrap {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:200; display:none;
  flex-direction:column; align-items:center; gap:8px;
  background:rgba(0,0,0,0.85);
  border:2px solid #00ff00; border-radius:3px;
  padding:14px 24px; min-width:320px;
}
#dl-label { font-family:'Courier New',monospace; font-size:15px; font-weight:bold; color:#00ff00; letter-spacing:2px; }
#dl-track { width:100%; height:20px; background:#111; border:1px solid #009900; border-radius:2px; overflow:hidden; }
#dl-fill  { height:100%; width:0%; background:linear-gradient(90deg,#009900,#00ff00); }
#dl-pct   { font-family:'Courier New',monospace; font-size:11px; color:#00ff00; }

/* ── Ransom — transparent bg, floating tab only ── */
#ransom {
  position:fixed; inset:0; display:none;
  align-items:center; justify-content:center; z-index:999;
  background:transparent;
}
#ransom-box { width:520px; border:2px solid #555; box-shadow:4px 4px 0 rgba(0,0,0,0.7); font-family:'Courier New',monospace; }
#r-title  { background:#3a6e1f; color:#fff; font-size:12px; font-weight:bold; letter-spacing:1px; padding:4px 10px; border-bottom:2px solid #234412; }
#r-main   { display:flex; padding:14px; background:#cc0000; align-items:center; gap:10px; }
#r-skull  { width:150px; height:150px; flex-shrink:0; object-fit:contain; }
#r-text   { flex:1; font-family:'Courier New',monospace; font-size:25px; font-weight:900; color:#fff; text-align:center; line-height:1.2; padding:0 8px; }
#r-warn   { background:#000; color:#fff; font-family:'Courier New',monospace; font-size:11px; font-weight:bold; padding:10px 14px; line-height:1.55; text-align:center; }
#r-footer { display:flex; align-items:center; justify-content:space-between; background:#cc0000; padding:10px 14px; }
#r-amount { font-family:'Courier New',monospace; font-size:32px; font-weight:900; color:#ffdd00; display:flex; align-items:center; gap:6px; }
#r-coin-img { width:36px; height:36px; object-fit:contain; }
#r-timer  { font-family:'Courier New',monospace; font-size:24px; font-weight:900; color:#fff; background:#000; border:2px solid #444; padding:6px 14px; letter-spacing:2px; min-width:160px; text-align:center; }

/* ── Thank you — green bg, floating tab bounces around ── */
#thankyou {
  position:fixed; inset:0; display:none;
  background:#22cc00; overflow:hidden;
  z-index:1000;
}
#ty-box {
  position:absolute;
  width:360px;
  border:3px solid #555;
  box-shadow:5px 5px 0 rgba(0,0,0,0.5);
  font-family:'Courier New',monospace;
}
#ty-title { background:#d4d0c8; color:#000; font-size:12px; font-weight:bold; padding:4px 8px; border-bottom:2px solid #999; }
#ty-body  { background:#22cc00; display:flex; flex-direction:column; align-items:center; padding:18px 16px 22px; gap:14px; }
#ty-text  { font-family:'Arial Black',Impact,sans-serif; font-size:42px; font-weight:900; font-style:italic; color:#fff; text-shadow:3px 3px 0 rgba(0,0,0,0.2); letter-spacing:2px; white-space:nowrap; }

/* CSS-drawn green thumbs-up stop sign — no image needed */
#ty-sign {
  width:140px; height:140px;
  background:#33dd00;
  clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);
  display:flex; align-items:center; justify-content:center;
  border:4px solid #1aaa00;
  font-size:70px;
  image-rendering:pixelated;
}

#hint { position:fixed; bottom:12px; right:14px; font-family:'Courier New',monospace; font-size:9px; color:rgba(255,255,255,0.2); z-index:9999; pointer-events:none; }
</style>

function fillDownload(pct, done) {
  dlFill.style.width = pct + '%';
  dlPct.textContent  = Math.round(pct) + '%';
  if (pct >= 100) { done(); return; }
  setTimeout(() => fillDownload(Math.min(100, pct + 0.7 + Math.random()*1.5), done), 38);
}

// ── ACT 4: ransom tab, transparent bg ──
let timerM = 1, timerS = 17, timerOn = false;
function act4ransom() {
  redLayer.style.display = 'none';
  ransom.style.display   = 'flex';
  timerOn = true;
  tickTimer();
}
function tickTimer() {
  if (!timerOn) return;
  document.getElementById('r-timer').textContent =
    'TIME: ' + String(timerM).padStart(2,'0') + ':' + String(timerS).padStart(2,'0');
  timerS--;
  if (timerS < 0) { timerS = 59; timerM--; }
  if (timerM < 0) { timerOn = false; showThankYou(); return; }
  setTimeout(tickTimer, 1000);
}

// ── ACT 5: thank you — tab bounces around the green screen ──
function showThankYou() {
  stopSound();
  ransom.style.display   = 'none';
  thankyou.style.display = 'block';
  startFloating();
  setTimeout(closePrank, 7000);
}

function startFloating() {
  const box = document.getElementById('ty-box');
  const W = box.offsetWidth  || 360;
  const H = box.offsetHeight || 200;
  let x  = window.innerWidth  / 2 - W / 2;
  let y  = window.innerHeight / 2 - H / 2;
  let vx = 3 + Math.random() * 2;
  let vy = 2 + Math.random() * 2;

  function frame() {
    if (thankyou.style.display === 'none') return;
    x += vx; y += vy;
    const maxX = window.innerWidth  - (box.offsetWidth  || W);
    const maxY = window.innerHeight - (box.offsetHeight || H);
    if (x <= 0)    { x = 0;    vx = Math.abs(vx); }
    if (x >= maxX) { x = maxX; vx = -Math.abs(vx); }
    if (y <= 0)    { y = 0;    vy = Math.abs(vy); }
    if (y >= maxY) { y = maxY; vy = -Math.abs(vy); }
    box.style.left = x + 'px';
    box.style.top  = y + 'px';
    requestAnimationFrame(frame);
  }
  box.style.left = x + 'px';
  box.style.top  = y + 'px';
  requestAnimationFrame(frame);
}

function closePrank() {
  timerOn = false;
  stopSound();
  try { window.api.hidePrank(); } catch(e) {}
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePrank(); });

act1();
</script>
