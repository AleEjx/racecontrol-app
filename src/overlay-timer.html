<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { background: transparent; margin: 0; overflow: hidden; }
    .ov-body {
      -webkit-app-region: drag;
      cursor: grab;
      padding: 6px;
    }
    .ov-body:active { cursor: grabbing; }
    .ov-resize-grip {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      -webkit-app-region: no-drag;
      background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.25) 50%);
    }
    .ov-resize-grip-h {
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: ew-resize;
      -webkit-app-region: no-drag;
    }

    .ov-scale-wrap {
      transform-origin: top left;
    }

    .ov-zoom-ctrl {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 3px;
      opacity: 0.5;
      transition: opacity 0.15s ease;
      z-index: 5;
      -webkit-app-region: no-drag;
    }
    .ov-zoom-ctrl:hover { opacity: 1; }
    .ov-zoom-ctrl button {
      width: 16px;
      height: 16px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
      background: rgba(0,0,0,0.55);
      color: #e8e8f0;
      font-size: 10px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .ov-zoom-ctrl button:hover {
      background: rgba(41,121,255,0.6);
      border-color: rgba(41,121,255,0.8);
    }

    button:focus,
    button:focus-visible {
      outline: none;
      box-shadow: none;
    }

    /* --- just the numbers --- */
    .rc-timer-plate {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 22px;
      border-radius: 10px;
      background: rgb(10 10 14 / var(--timer-overlay-opacity, 0.55));
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .rc-timer-time {
      font-family: 'Oxanium', sans-serif;
      font-weight: 800;
      font-size: 48px;
      line-height: 1;
      letter-spacing: 0.5px;
      color: #e8e8f0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      transition: color 0.15s ease;
    }
    .rc-timer-plate.running .rc-timer-time { color: var(--green, #00e676); }

    .ov-recent-laps { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; width: 100%; }
    .ov-recent-lap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 3px 10px;
      border-radius: 8px;
      background: rgb(10 10 14 / var(--timer-overlay-opacity, 0.55));
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: 'Oxanium', sans-serif;
    }
    .ov-recent-lap .orl-num  { font-size: 9px; color: rgba(232,232,240,0.55); font-weight: 700; }
    .ov-recent-lap .orl-time { font-size: 15px; font-weight: 800; color: #e8e8f0; font-variant-numeric: tabular-nums; }
    .ov-recent-lap.faster { border-color: rgba(0,230,118,0.5); }
    .ov-recent-lap.faster .orl-time { color: var(--green, #00e676); }
    .ov-recent-lap.slower { border-color: rgba(255,23,68,0.5); }
    .ov-recent-lap.slower .orl-time { color: var(--red, #ff1744); }
  </style>
</head>
<body>
  <div class="ov-body" id="ov-body">
    <div class="ov-zoom-ctrl" id="ov-zoom-ctrl">
      <button onclick="adjustOverlayScale(-0.1)" title="Smaller">－</button>
      <button onclick="adjustOverlayScale(0.1)" title="Bigger">＋</button>
    </div>
    <div class="ov-scale-wrap" id="ov-scale-wrap">
      <div class="rc-timer-plate" id="rc-timer-plate">
        <div class="rc-timer-time" id="rc-timer-time">00:00.00</div>
      </div>
      <div class="ov-recent-laps" id="ov-recent-laps"></div>
    </div>
  </div>

  <script>
    let config = null;
    let _ovScale = 1;
    let _ovScaleSaveTimer = null;

    function formatStopwatchTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = (seconds % 60).toFixed(2);
      return `${String(mins).padStart(2, "0")}:${secs.padStart(5, "0")}`;
    }

    function formatLapTime(seconds) {
      if (typeof seconds !== "number" || isNaN(seconds)) return "–";
      const mins = Math.floor(seconds / 60);
      const secs = (seconds % 60).toFixed(2);
      return mins > 0 ? `${mins}:${secs.padStart(5, "0")}` : `${secs}s`;
    }

    function applyOverlayScale(scale) {
      _ovScale = Math.round(Math.min(2, Math.max(0.7, scale)) * 100) / 100;
      const wrap = document.getElementById("ov-scale-wrap");
      if (wrap) wrap.style.zoom = _ovScale;
      requestAnimationFrame(() => requestAnimationFrame(fitWindowHeight));
    }

    function adjustOverlayScale(delta) {
      applyOverlayScale(_ovScale + delta);
      if (config) {
        config.timerOverlayScale = _ovScale;
        clearTimeout(_ovScaleSaveTimer);
        _ovScaleSaveTimer = setTimeout(() => window.api.saveConfig(config), 400);
      }
    }

    document.addEventListener("wheel", (e) => {
      e.preventDefault();
      adjustOverlayScale(e.deltaY < 0 ? 0.05 : -0.05);
    }, { passive: false });

    function fitWindowHeight() {
      const body = document.querySelector(".ov-body");
      if (!body) return;
      const h = Math.ceil(body.getBoundingClientRect().height) + 4;
      window.api.overlayFitHeight(h);
    }

    // --- Live timer readout, driven off the same localStorage keys the
    // main window writes to on practiceStart/practiceLap/practiceReset ---
    let _lastRunningState = null;

    function tickTimer() {
      const running = localStorage.getItem("rc_practice_running") === "1";
      const plate = document.getElementById("rc-timer-plate");
      const timeEl = document.getElementById("rc-timer-time");

      if (running !== _lastRunningState) {
        plate.classList.toggle("running", running);
        _lastRunningState = running;
      }

      if (running) {
        const lastLapTs = Number(localStorage.getItem("rc_practice_last_lap_ts") || 0);
        const elapsed = lastLapTs ? (Date.now() - lastLapTs) / 1000 : 0;
        timeEl.textContent = formatStopwatchTime(Math.max(elapsed, 0));
      } else {
        timeEl.textContent = "00:00.00";
      }
    }

    // Catch changes instantly when they happen in the other window...
    window.addEventListener("storage", (e) => {
      if (e.key === "rc_practice_running" || e.key === "rc_practice_last_lap_ts") tickTimer();
      if (e.key === "rc_timer_overlay_opacity") applyTimerOverlayOpacity();
      if (e.key === "rc_practice_laps") renderRecentLaps();
    });
    // ...and keep ticking smoothly while running.
    setInterval(tickTimer, 47);

    let _lastLapsRaw = null;
    function renderRecentLaps() {
      const raw = localStorage.getItem("rc_practice_laps");
      if (raw === _lastLapsRaw) return; // avoid needless re-renders on the poll tick
      _lastLapsRaw = raw;

      const el = document.getElementById("ov-recent-laps");
      if (!el) return;
      let laps = [];
      try { laps = raw ? JSON.parse(raw) : []; } catch { laps = []; }
      if (!laps.length) { el.innerHTML = ""; requestAnimationFrame(() => requestAnimationFrame(fitWindowHeight)); return; }

      const times = laps.map(l => l.time);
      const best = Math.min(...times);
      const worst = Math.max(...times);
      const hasSpread = times.length > 1;
      const recent = laps.slice(-2).reverse();
      el.innerHTML = recent.map(l => {
        const isBest = l.time === best;
        const isWorst = hasSpread && l.time === worst && !isBest;
        const cls = isBest ? "faster" : isWorst ? "slower" : "";
        return `
          <div class="ov-recent-lap ${cls}">
            <span class="orl-num">L${l.lap}</span>
            <span class="orl-time">${formatLapTime(l.time)}</span>
          </div>`;
      }).join("");
      requestAnimationFrame(() => requestAnimationFrame(fitWindowHeight));
    }
    // Poll too, in case the OS/Electron doesn't fire cross-window storage
    // events reliably — cheap no-op re-render when nothing changed.
    setInterval(renderRecentLaps, 500);

    function applyTimerOverlayOpacity() {
      const saved = localStorage.getItem("rc_timer_overlay_opacity");
      const pct = saved ? Number(saved) : 55;
      document.documentElement.style.setProperty("--timer-overlay-opacity", (pct / 100).toString());
    }

    window.addEventListener("DOMContentLoaded", async () => {
      config = await window.api.getConfig();
      applyOverlayScale(config.timerOverlayScale || 1);
      applyTimerOverlayOpacity();
      renderRecentLaps();
      requestAnimationFrame(() => requestAnimationFrame(fitWindowHeight));
      tickTimer();
    });
  </script>
  <div class="ov-resize-grip" id="ov-resize-grip"></div>
  <div class="ov-resize-grip-h" id="ov-resize-grip-h"></div>
</body>
</html>
