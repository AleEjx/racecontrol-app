<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { background: transparent; margin: 0; overflow: hidden; height: 100%; }
    body {
      /* Custom horizontal-only drag replaces the OS-level drag region,
         so both axes aren't free-moved by the window manager. */
      cursor: grab;
      user-select: none;
    }
    body.dragging { cursor: grabbing; }
    .ov-body { padding: 6px; height: 100%; overflow-y: auto; }
    .ov-resize-grip {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 10px;
      height: 10px;
      cursor: nwse-resize;
      -webkit-app-region: no-drag;
      /* Matches the widget's own border instead of a generic white gradient.
         Swap the color below for your widget's exact border color/width
         once you share style.css. */
      border-right: 1px solid var(--widget-border-color, rgba(255,255,255,0.25));
      border-bottom: 1px solid var(--widget-border-color, rgba(255,255,255,0.25));
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="ov-body" id="d-leaderboard">
    <div class="placeholder-text">Waiting for race...</div>
  </div>
  <div class="ov-resize-grip" id="ov-resize-grip"></div>
<script>
    let config = null, apiUrl = "";
    function renderLeaderboard(drivers, me) {
      const lb = document.getElementById("d-leaderboard");
      if (!drivers?.length) { lb.innerHTML = '<div class="placeholder-text">Waiting for race...</div>'; return; }
      lb.innerHTML = drivers.map((d, i) => {
        const pos = i + 1;
        const pc = pos === 1 ? "p1" : pos === 2 ? "p2" : pos === 3 ? "p3" : "";
        const isMe = d.name === me;
        const lapHtml = d.dnf ? `<div class="f-lap dnf-text">DNF</div>` : d.finished ? `<div class="f-lap finished">Finished</div>` : `<div class="f-lap">Lap ${d.lap || 1}</div>`;
        return `<div class="f-row ${isMe ? "you" : ""} ${d.dnf ? "dnf" : ""} ${d.inPits ? "pitting" : ""}">
          <div class="f-pos ${pc}">${pos}</div>
          <div class="f-num ${d.inPits ? "pitting" : ""}">${d.number}</div>
          <div class="f-body"><div class="f-name">${d.name}</div><div class="f-call">${d.callsign}</div></div>
          <div>${lapHtml}</div>
        </div>`;
      }).join("");
    }
    async function poll() {
      if (!apiUrl) return;
      try {
        const res = await fetch(`${apiUrl}/driver/state`);
        if (!res.ok) return;
        const data = await res.json();
        renderLeaderboard(data.drivers, config?.driver);
      } catch {}
    }
    const BASE_WIDTH = 300;
    function updateScale() {
      document.documentElement.style.zoom = window.innerWidth / BASE_WIDTH;
    }
    window.addEventListener("resize", updateScale);
    window.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 20 : 4;
      let dx = 0;
      if (e.key === "ArrowLeft") dx = -step;
      else if (e.key === "ArrowRight") dx = step;
      else return; // vertical arrow keys no longer move the overlay
      e.preventDefault();
      window.api.overlayNudge(dx, 0);
    });

    // --- Resize grip (unchanged behavior, just smaller/border-matched now) ---
    const grip = document.getElementById("ov-resize-grip");
    let resizing = false, lastX = 0, lastY = 0;
    grip.addEventListener("mousedown", (e) => {
      resizing = true;
      lastX = e.screenX;
      lastY = e.screenY;
      e.preventDefault();
      e.stopPropagation(); // don't let this also trigger body drag
    });
    window.addEventListener("mousemove", (e) => {
      if (!resizing) return;
      const dw = e.screenX - lastX;
      const dh = e.screenY - lastY;
      lastX = e.screenX;
      lastY = e.screenY;
      window.api.overlayResizeBy(dw, dh);
    });
    window.addEventListener("mouseup", () => { resizing = false; });

    // --- Custom horizontal-only window drag ---
    let dragging = false, dragLastX = 0;
    document.body.addEventListener("mousedown", (e) => {
      if (e.target.closest("#ov-resize-grip")) return;
      dragging = true;
      dragLastX = e.screenX;
      document.body.classList.add("dragging");
      e.preventDefault();
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const dx = e.screenX - dragLastX;
      dragLastX = e.screenX;
      if (dx !== 0) window.api.overlayNudge(dx, 0);
    });
    window.addEventListener("mouseup", () => {
      dragging = false;
      document.body.classList.remove("dragging");
    });

    window.addEventListener("DOMContentLoaded", async () => {
      config = await window.api.getConfig();
      apiUrl = config.apiUrl || "";
      updateScale();
      poll();
      setInterval(poll, 3000);
    });
  </script>
</body>
</html>
